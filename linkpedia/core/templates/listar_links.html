<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Links</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
        }

        .container-box{
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        .titulo{
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .topo{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-responsive{
            border-radius: 10px;
        }

        .acoes{
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        td{
            vertical-align: middle;
        }

        @media(max-width: 768px){

            .container-box{
                padding: 20px;
            }

            .topo{
                flex-direction: column;
                align-items: stretch;
            }

            .topo a{
                width: 100%;
            }

            table{
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="container-box">

            <h1 class="titulo">
                Lista de Links
            </h1>

            <div class="topo">

                <a href="/cadastrar/" class="btn btn-primary">
                    + Novo Link
                </a>

                <a href="/" class="btn btn-secondary">
                    Voltar
                </a>

            </div>

            <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>Título</th>
                            <th>Link</th>
                            <th>Observação</th>
                            <th width="180">Ações</th>
                        </tr>

                    </thead>

                    <tbody>

                        {% for link in links %}

                        <tr>

                            <td>
                                {{ link.titulo }}
                            </td>

                            <td>

                                <a href="{{ link.link }}" target="_blank">
                                    Abrir Link
                                </a>

                            </td>

                            <td>
                                {{ link.observacao }}
                            </td>

                            <td>

                                <div class="acoes">

                                    <a href="/editar/{{ link.id }}/"
                                       class="btn btn-warning btn-sm">

                                        Editar

                                    </a>

                                    <a href="/excluir/{{ link.id }}/"
                                       class="btn btn-danger btn-sm">

                                        Excluir

                                    </a>

                                </div>

                            </td>

                        </tr>

                        {% empty %}

                        <tr>

                            <td colspan="4" class="text-center">

                                Nenhum link cadastrado.

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
