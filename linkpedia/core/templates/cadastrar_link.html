<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Link</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .container-box{
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
            width: 100%;
        }

        .titulo{
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        label{
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, textarea{
            margin-bottom: 20px !important;
        }

        .botoes{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media(max-width: 768px){

            .container-box{
                padding: 25px;
            }

            .botoes{
                flex-direction: column;
            }

            .botoes a,
            .botoes button{
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="container-box">

                    <h1 class="titulo">
                        Cadastrar Link
                    </h1>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="botoes">

                            <button type="submit" class="btn btn-primary">
                                Salvar Link
                            </button>

                            <a href="/links/" class="btn btn-secondary">
                                Voltar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
